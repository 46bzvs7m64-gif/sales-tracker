<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人销售业绩管理系统</title>
<style>
:root{--bg:#0d1117;--panel:rgba(255,255,255,.04);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--txt:#e6edf3;--dim:#8b949e;--faint:#6e7681;--cyan:#22d3ee;--blue:#3b82f6;--green:#34d399;--red:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);padding:26px 20px 44px}
body::before{content:"";position:fixed;top:-180px;left:50%;transform:translateX(-50%);width:760px;height:340px;background:radial-gradient(closest-side,rgba(34,211,238,.09),transparent);pointer-events:none;z-index:0}
.wrap{max-width:1120px;margin:auto;position:relative;z-index:1}
.topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
h1{font-size:21px;font-weight:700;letter-spacing:.5px}
h1 span{color:var(--cyan)}
.sub{color:var(--dim);font-size:12.5px;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:none;border-radius:8px;font-size:13px;padding:8px 14px;font-family:inherit;transition:filter .15s,background .15s}
.btn-primary{background:var(--cyan);color:#05242e;font-weight:600}
.btn-primary:hover{filter:brightness(1.15)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:#c9d1d9}
.btn-ghost:hover{background:rgba(255,255,255,.11)}
.btn-danger{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);color:var(--red)}
.btn-danger:hover{background:rgba(248,113,113,.17)}
.btn-r{background:var(--cyan);color:#05242e;font-weight:600;width:100%;margin-top:16px;padding:10px}
.btn-r:hover{filter:brightness(1.15)}
.btn-o{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:#c9d1d9;padding:4px 10px;font-size:11.5px}
.btn-o:hover{background:rgba(255,255,255,.11)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:background .15s,border-color .15s}
.kpi:hover{background:rgba(255,255,255,.07);border-color:var(--line2)}
.kpi .lab{font-size:12px;color:var(--dim);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.kpi .dot{width:6px;height:6px;border-radius:50%;flex:none}
.kpi .val{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{font-size:13.5px;font-weight:600;color:#c9d1d9;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--cyan);flex:none}
label{font-size:12px;color:var(--dim);display:block;margin:10px 0 4px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;font-size:13px;background:rgba(13,17,23,.65);color:var(--txt);font-family:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.14)}
select{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238b949e' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
select option{background:#161b22;color:var(--txt)}
.funnel .frow{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.funnel .lab{width:62px;flex:none;color:var(--dim)}
.funnel .track{flex:1;min-width:0}
.funnel .bar{height:22px;border-radius:5px;min-width:3px;transition:width .25s}
.funnel .num{width:76px;flex:none;text-align:right;color:#c9d1d9;font-size:12px;font-variant-numeric:tabular-nums}
.wf-big{font-size:30px;font-weight:700;color:var(--cyan);font-variant-numeric:tabular-nums;line-height:1.2}
.wf-sub{font-size:12px;color:var(--dim);margin:6px 0 16px}
.wf-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.wf-row .wl{width:84px;flex:none;color:var(--dim)}
.wf-row .wl i{font-style:normal;color:var(--cyan);font-size:10.5px;margin-left:3px}
.wf-row .track{flex:1;min-width:0}
.wf-row .wbar{height:13px;border-radius:4px;background:linear-gradient(90deg,rgba(34,211,238,.9),rgba(59,130,246,.9));min-width:2px;transition:width .25s}
.wf-row .wn{width:128px;flex:none;text-align:right;color:#c9d1d9}
.trend-svg{width:100%;height:auto;display:block}
.trend-foot{font-size:12px;color:var(--dim);margin-top:10px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.tbl-wrap::-webkit-scrollbar{height:8px}
.tbl-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
table{width:100%;min-width:780px;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;white-space:nowrap}
th{color:var(--dim);font-weight:500;font-size:12px;background:rgba(255,255,255,.02)}
td.wrap{white-space:normal;min-width:120px}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.03)}
.row-stage{width:auto;padding:4px 24px 4px 8px;font-size:12px;border-radius:6px}
.note{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.7}
@media(max-width:920px){.kpis{grid-template-columns:repeat(2,1fr)}.grid,.grid2{grid-template-columns:1fr}}
@media(max-width:480px){body{padding:16px 12px 32px}.kpi .val{font-size:20px}.wf-big{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>个人销售业绩<span>管理系统</span></h1>
      <div class="sub">客户跟进 · 销售漏斗 · 加权商机预测 · 近 8 周成单趋势 · 数据存本地浏览器（localStorage），双击即用</div>
    </div>
    <div class="actions">
      <button class="btn-ghost" onclick="exportCSV()">导出 CSV</button>
      <button class="btn-ghost" onclick="seed(true)">载入演示数据</button>
      <button class="btn-danger" onclick="clearAll()">清空全部</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card">
      <h3>录入 / 更新客户</h3>
      <label>客户名称 *<input id="fName" placeholder="如：淘宝服饰客户A-王经理"></label>
      <label>来源渠道
        <select id="fCh"><option>抖音</option><option>小红书</option><option>百度</option><option>B站</option><option>转介绍</option><option>陌拜</option><option>其他</option></select>
      </label>
      <label>当前阶段
        <select id="fStage"><option>线索</option><option>初步沟通</option><option>方案报价</option><option>商务谈判</option><option>成单</option><option>流失</option></select>
      </label>
      <label>预计/成交金额（元）<input id="fAmt" type="number" min="0" value="0"></label>
      <label>备注<input id="fNote" placeholder="需求、下一步动作..."></label>
      <button class="btn-r" onclick="addLead()">保存客户</button>
      <p class="note">阶段推进时重新选择并保存同名客户即可更新；成交自动计入业绩。</p>
    </div>

    <div class="card">
      <h3>销售漏斗与转化</h3>
      <div class="funnel" id="funnel"></div>
      <p class="note" id="storageInfo"></p>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>加权商机预测</h3>
      <div class="wf-big" id="wfBig">¥0</div>
      <div class="wf-sub">加权预测成交额 = Σ（在途商机金额 × 阶段概率），随阶段推进实时重算</div>
      <div id="wfRows"></div>
      <p class="note">各阶段概率：线索 10% / 初步沟通 30% / 方案报价 50% / 商务谈判 70%；成单（100%）直接计入业绩，不参与预测。</p>
    </div>
    <div class="card">
      <h3>近 8 周成单趋势</h3>
      <div id="trend"></div>
      <div class="trend-foot" id="trendFoot"></div>
    </div>
  </div>

  <div class="card">
    <h3>客户列表</h3>
    <div class="tbl-wrap">
      <table id="tbl"><thead><tr><th>客户</th><th>渠道</th><th>阶段</th><th>金额</th><th>周期</th><th>更新日</th><th>备注</th><th></th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<script>
const KEY='sales_tracker_v1';
const STAGES=['线索','初步沟通','方案报价','商务谈判','成单','流失'];
const PROB={'线索':.1,'初步沟通':.3,'方案报价':.5,'商务谈判':.7};
const SEED=[
 ['淘宝-服饰客户A 王经理','抖音','成单',12000,'春装上新投放','-42','-38'],
 ['京东-3C客户B 李总','百度','成单',26000,'旗舰机新品排期','-35','-30'],
 ['世纪佳缘 周经理','小红书','商务谈判',18000,'信息流框架洽谈','-28','-26'],
 ['本地餐饮 张店长','B站','方案报价',6000,'探店+开屏组合方案','-20','-18'],
 ['教育客户E 赵老师','百度','方案报价',9000,'考研旺季投放计划','-15','-13'],
 ['美妆新品牌 陈总','小红书','初步沟通',0,'初次电话沟通需求','-12','-10'],
 ['二手车平台 沈经理','抖音','初步沟通',0,'留资待回访','-9','-7'],
 ['医美机构 何院长','转介绍','线索',0,'展会拿到名片','-5','-5'],
 ['预制菜品牌 唐总','转介绍','成单',8000,'老客户介绍已签框','-40','-33'],
 ['旅拍连锁 曹店长','抖音','流失',5000,'预算转给线下渠道','-25','-22'],
 ['酒店 许经理','百度','流失',4000,'今年无线上预算','-18','-16'],
 ['SaaS公司 董经理','B站','线索',0,'私信未回复','-3','-3'],
 ['电商客户C 吴女士','小红书','商务谈判',15000,'合同条款审核中','-30','-28'],
 ['茶饮加盟 刘总','抖音','初步沟通',0,'咨询加盟获客成本','-6','-4'],
 ['健身工作室 周教练','小红书','线索',0,'评论区留资待联系','-2','-2'],
 ['宠物医院 林院长','百度','线索',0,'搜索推广表单线索','-1','-1']
];

function today(){return new Date().toISOString().slice(0,10)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()+ +n);return d.toISOString().slice(0,10)}

function seed(force){
  if(!force && load().length) return;
  if(force && load().length && !confirm('覆盖当前数据并载入演示数据？')) return;
  save(SEED.map(([name,ch,stage,amt,note,c,u],i)=>({
    id:Date.now()+i,name,ch,stage,amt:+amt,note,
    created:daysAgo(c),updated:daysAgo(u)
  })));
  render();
}
function clearAll(){if(confirm('确定清空全部客户数据？')){localStorage.removeItem(KEY);render()}}

function addLead(){
  const name=fName.value.trim();
  if(!name){alert('请填写客户名称');return}
  const d=load();
  const exist=d.find(x=>x.name===name);
  const now=today();
  if(exist){exist.ch=fCh.value;exist.stage=fStage.value;exist.amt=+fAmt.value||exist.amt;exist.note=fNote.value||exist.note;exist.updated=now}
  else{d.push({id:Date.now(),name,ch:fCh.value,stage:fStage.value,amt:+fAmt.value,note:fNote.value,created:now,updated:now})}
  save(d);fName.value='';fAmt.value=0;fNote.value='';render();
}

function setStage(id,stage){const d=load();const x=d.find(v=>v.id===id);x.stage=stage;x.updated=today();save(d);render()}
function del(id){if(!confirm('删除该客户？'))return;save(load().filter(x=>x.id!==id));render()}

function cycleDays(x){return Math.round((new Date(x.updated)-new Date(x.created))/864e5)}
function parseDay(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function mondayOf(dt){const d=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d}

function renderTrend(won){
  const base=mondayOf(new Date());
  const weeks=[];
  for(let i=7;i>=0;i--){const s=new Date(base);s.setDate(s.getDate()-i*7);weeks.push(s)}
  const counts=[0,0,0,0,0,0,0,0],amts=[0,0,0,0,0,0,0,0];
  won.forEach(x=>{
    const t=parseDay(x.updated).getTime();
    for(let i=7;i>=0;i--){if(t>=weeks[i].getTime()){counts[i]++;amts[i]+=(x.amt||0);break}}
  });
  const maxC=Math.max.apply(null,counts.concat([1]));
  const W=360,H=180,PT=20,PB=26,step=(W-16)/8,bw=20;
  let bars='';
  weeks.forEach((w,i)=>{
    const c=counts[i];
    const h=c>0?Math.max(4,c/maxC*(H-PT-PB-16)):0;
    const x=8+step*i+(step-bw)/2;
    if(c>0) bars+=`<rect x="${x.toFixed(1)}" y="${(H-PB-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" fill="url(#gbar)"/>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-PB-h-6).toFixed(1)}" text-anchor="middle" font-size="10" fill="${c>0?'#22d3ee':'#6e7681'}">${c}</text>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#6e7681">${('0'+(w.getMonth()+1)).slice(-2)}/${('0'+w.getDate()).slice(-2)}</text>`;
  });
  const total=counts.reduce((a,b)=>a+b,0);
  trend.innerHTML=`<svg class="trend-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="近8周成单趋势柱状图"><defs><linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><line x1="4" y1="${H-PB}" x2="${W-4}" y2="${H-PB}" stroke="rgba(255,255,255,.12)"/>${bars}</svg>`+(total?'':'<p class="note">暂无成单记录：载入演示数据或将客户阶段推进为成单后，将按周自动归集生成趋势。</p>');
  trendFoot.textContent=`近 8 周合计成交 ${total} 单 · ¥${amts.reduce((a,b)=>a+b,0).toLocaleString()}（按成单客户更新日期归周，无数据周记 0）`;
}

function render(){
  const d=load();
  document.getElementById('storageInfo').textContent=`本地已存储 ${d.length} 条客户记录，仅保存在当前浏览器`;
  const cnt=s=>d.filter(x=>x.stage===s).length;
  const won=d.filter(x=>x.stage==='成单');
  const wonAmt=won.reduce((a,x)=>a+(x.amt||0),0);
  const inflight=d.filter(x=>x.stage!=='成单'&&x.stage!=='流失');
  const pipeline=inflight.reduce((a,x)=>a+(x.amt||0),0);
  const closed=won.length+cnt('流失');
  const winRate=closed?(won.length/closed*100):0;
  const avgCycle=won.length?(won.reduce((a,x)=>a+cycleDays(x),0)/won.length):0;

  kpis.innerHTML=[
    ['在途商机额','¥'+pipeline.toLocaleString(),'#22d3ee'],
    ['成交金额','¥'+wonAmt.toLocaleString(),'#34d399'],
    ['成交客户',won.length+' 家','#34d399'],
    ['赢单率',winRate.toFixed(0)+'%','#22d3ee'],
    ['平均成交周期',avgCycle.toFixed(0)+' 天','#60a5fa']
  ].map(([l,v,c])=>`<div class="kpi"><div class="lab"><span class="dot" style="background:${c}"></span>${l}</div><div class="val">${v}</div></div>`).join('');

  const base=cnt('线索')||1;
  funnel.innerHTML=STAGES.map((s,i)=>{
    const n=cnt(s);
    const a=Math.max(.4,1-i*.11).toFixed(2);
    return `<div class="frow"><span class="lab">${s}</span><div class="track"><div class="bar" style="width:${Math.max(2,n/base*100).toFixed(1)}%;background:linear-gradient(90deg,rgba(34,211,238,${a}),rgba(59,130,246,${a}))"></div></div><span class="num">${n} · ${(n/(d.length||1)*100).toFixed(0)}%</span></div>`;
  }).join('');

  const rows=STAGES.slice(0,4).map(s=>{
    const xs=inflight.filter(x=>x.stage===s);
    return {s,n:xs.length,w:xs.reduce((a,x)=>a+(x.amt||0)*(PROB[s]||0),0)};
  });
  const wfTotal=rows.reduce((a,r)=>a+r.w,0);
  wfBig.textContent='¥'+Math.round(wfTotal).toLocaleString();
  const maxW=Math.max.apply(null,rows.map(r=>r.w).concat([1]));
  wfRows.innerHTML=rows.map(r=>`<div class="wf-row"><span class="wl">${r.s}<i>×${Math.round(PROB[r.s]*100)}%</i></span><div class="track"><div class="wbar" style="width:${(r.w/maxW*100).toFixed(1)}%"></div></div><span class="wn">${r.n} 家 · ¥${Math.round(r.w).toLocaleString()}</span></div>`).join('');

  renderTrend(won);

  tbl.querySelector('tbody').innerHTML=d.slice().sort((a,b)=>b.updated.localeCompare(a.updated)).map(x=>{
    const amtStyle=x.stage==='成单'?' style="color:var(--green)"':(x.stage==='流失'?' style="color:var(--red)"':'');
    return `<tr><td>${x.name}</td><td>${x.ch}</td>
    <td><select class="row-stage" onchange="setStage(${x.id},this.value)">
    ${STAGES.map(s=>`<option ${s===x.stage?'selected':''}>${s}</option>`).join('')}</select></td>
    <td${amtStyle}>¥${(x.amt||0).toLocaleString()}</td><td>${cycleDays(x)}天</td><td>${x.updated}</td><td class="wrap">${x.note||''}</td>
    <td class="row-actions"><button class="btn-o" onclick="del(${x.id})">删</button></td></tr>`;
  }).join('');
}

function exportCSV(){
  const d=load();
  const h=['客户','渠道','阶段','金额','创建日','更新日','周期天数','备注'];
  const rows=d.map(x=>[x.name,x.ch,x.stage,x.amt,x.created,x.updated,cycleDays(x),x.note||''].join(','));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+[h.join(','),...rows].join('\n')],{type:'text/csv'}));
  a.download='销售客户管理导出.csv';a.click();
}

seed(false);
render();
</script>
</body>
</html>
